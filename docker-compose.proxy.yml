services:
  gateway:
    ports: !reset []
    restart: always
    networks:
      proxy:
        aliases:
          - ${APP_NAME}-${ENVIRONMENT}
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${PROXY_NETWORK}"
      - "traefik.http.services.${APP_NAME}-${ENVIRONMENT}.loadbalancer.server.port=${PORT}"

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK}
