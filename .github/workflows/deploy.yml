name: Deploy

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'arara-ide/arara-agent-gateway' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/development')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'sandbox' }}
    steps:
      - name: Trigger deployment
        shell: bash
        env:
          KOMODO_URL: ${{ secrets.KOMODO_URL }}
          KOMODO_API_KEY: ${{ secrets.KOMODO_API_KEY }}
          KOMODO_API_SECRET: ${{ secrets.KOMODO_API_SECRET }}
          KOMODO_PROCEDURE: ${{ secrets.KOMODO_PROCEDURE }}
        run: |
          set +x
          set -euo pipefail
          if [ -z "$KOMODO_URL" ] || [ -z "$KOMODO_API_KEY" ] || [ -z "$KOMODO_API_SECRET" ] || [ -z "$KOMODO_PROCEDURE" ]; then
            echo "Deployment secrets are not configured for this environment."
            exit 1
          fi
          base_url="${KOMODO_URL%/}"
          if [[ ! "$base_url" =~ ^https://[a-zA-Z0-9.-]+(:[0-9]+)?(/[a-zA-Z0-9._/-]+)?$ ]] ||
             [[ "$KOMODO_API_KEY$KOMODO_API_SECRET" == *[!a-zA-Z0-9._~+=/-]* ]]; then
            echo "Deployment credentials have an invalid format."
            exit 1
          fi
          host_only="${base_url#*://}"
          host_only="${host_only%%/*}"
          echo "::add-mask::$host_only"
          umask 077
          scratch=$(mktemp -d)
          trap 'rm -rf -- "$scratch"' EXIT
          printf 'header = "Content-Type: application/json"\nheader = "X-Api-Key: %s"\nheader = "X-Api-Secret: %s"\n' \
            "$KOMODO_API_KEY" "$KOMODO_API_SECRET" > "$scratch/headers"
          printf 'url = "%s/execute"\n' "$base_url" > "$scratch/execute"
          printf 'url = "%s/read"\n' "$base_url" > "$scratch/read"
          jq -nc '{type:"RunProcedure",params:{procedure:env.KOMODO_PROCEDURE}}' > "$scratch/body"
          unset KOMODO_URL KOMODO_API_KEY KOMODO_API_SECRET KOMODO_PROCEDURE base_url host_only

          request() {
            local status
            if ! status=$(curl --disable --silent --proto '=https' --connect-timeout 15 --max-time 25 \
              --write-out '%{http_code}' --output "$scratch/response" --config "$scratch/headers" \
              --config "$scratch/$1" --data-binary "@$scratch/body" 2>/dev/null); then
              echo "Could not complete the Komodo request."
              return 1
            fi
            if [[ ! "$status" =~ ^2[0-9]{2}$ ]]; then
              if [[ "$status" =~ ^[0-9]{3}$ ]]; then
                echo "Komodo request failed (HTTP $status)."
              else
                echo "Invalid Komodo HTTP status."
              fi
              return 1
            fi
          }

          request execute
          update_id=$(jq -er '._id."$oid" | select(type == "string" and test("^[0-9a-f]{24}$"))' "$scratch/response" 2>/dev/null) || {
            echo "Invalid Komodo deployment response."
            exit 1
          }
          jq -nc --arg id "$update_id" '{type:"GetUpdate",params:{id:$id}}' > "$scratch/body"
          deadline=$((SECONDS + 480))
          while ((SECONDS < deadline)); do
            case $(jq -r '.status' "$scratch/response" 2>/dev/null) in
              Complete)
                if jq -e '.success == true' "$scratch/response" >/dev/null 2>&1; then
                  echo "Komodo deployment completed successfully."
                  exit 0
                fi
                echo "Komodo deployment failed. Check Komodo for details."
                exit 1
                ;;
              Queued|InProgress) ;;
              *)
                echo "Invalid Komodo deployment status."
                exit 1
                ;;
            esac
            sleep 10
            request read
          done
          echo "Timed out waiting for Komodo deployment."
          exit 1
