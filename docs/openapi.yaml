openapi: 3.1.0
info:
  title: Arara Agent Gateway API
  version: 2.0.0
  license:
    name: MIT
    identifier: MIT
  description: |
    Server-to-server API that manages isolated coding agent instances (Claude Code, Codex, Google Antigravity).
    Every request except `/api/health` and `/api/openapi.yaml` requires the global `apikey` header.
    Each instance is self-contained with its own container, volume, connections, GitHub token and run history.
    The integrating backend maps instances to its own users.
servers:
  - url: http://localhost:3000
security:
  - apikey: []
tags:
  - name: system
  - name: instances
  - name: runs
  - name: agents
  - name: repos
  - name: github
paths:
  /api/health:
    get:
      tags: [system]
      security: []
      summary: Liveness and dependency check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          description: Database or Docker unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /api/agents:
    get:
      tags: [agents]
      summary: Agents supported by the gateway
      responses:
        "200":
          description: Agent catalog
          content:
            application/json:
              schema:
                type: object
                properties:
                  agents:
                    type: array
                    items: { $ref: "#/components/schemas/AgentInfo" }
        "401": { $ref: "#/components/responses/Error" }
  /api/instances:
    get:
      tags: [instances]
      summary: List all instances
      responses:
        "200":
          description: Instances
          content:
            application/json:
              schema:
                type: object
                properties:
                  instances:
                    type: array
                    items: { $ref: "#/components/schemas/Instance" }
        "401": { $ref: "#/components/responses/Error" }
    post:
      tags: [instances]
      summary: Create a new instance (does not start a container)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string, maxLength: 80 }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/responses/InstanceResponse" }
        "400": { $ref: "#/components/responses/Error" }
  /api/instances/metrics:
    get:
      tags: [instances]
      summary: Resource usage of every instance (storage of the volume; CPU and memory only while running)
      responses:
        "200":
          description: Metrics
          content:
            application/json:
              schema:
                type: object
                properties:
                  instances:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        state: { type: string }
                        storage_bytes: { type: [integer, "null"] }
                        cpu_percent: { type: [number, "null"] }
                        memory_bytes: { type: [integer, "null"] }
                        memory_limit_bytes: { type: [integer, "null"] }
        "401": { $ref: "#/components/responses/Error" }
  /api/instances/{id}:
    parameters: [{ $ref: "#/components/parameters/InstanceId" }]
    get:
      tags: [instances]
      summary: Get an instance
      responses:
        "200": { $ref: "#/components/responses/InstanceResponse" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      tags: [instances]
      summary: Rename or select the default repository
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string, maxLength: 80 }
                selected_repo: { type: string, description: "owner/name or empty string to clear" }
      responses:
        "200": { $ref: "#/components/responses/InstanceResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      tags: [instances]
      summary: Permanently delete container, volume, connections, history and instance state
      parameters:
        - name: confirm
          in: query
          required: true
          description: Must equal the instance id
          schema: { type: string }
      responses:
        "204": { description: Deleted }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/instances/{id}/start:
    parameters: [{ $ref: "#/components/parameters/InstanceId" }]
    post:
      tags: [instances]
      summary: Start the container (idempotent)
      responses:
        "200": { $ref: "#/components/responses/InstanceResponse" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/instances/{id}/stop:
    parameters: [{ $ref: "#/components/parameters/InstanceId" }]
    post:
      tags: [instances]
      summary: Cancel active runs and logins, stop and remove the container, keep the volume (idempotent)
      responses:
        "200": { $ref: "#/components/responses/InstanceResponse" }
        "404": { $ref: "#/components/responses/Error" }
  /api/instances/{id}/status:
    parameters: [{ $ref: "#/components/parameters/InstanceId" }]
    get:
      tags: [instances]
      summary: Instance with live agent connection states and GitHub state
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                type: object
                properties:
                  instance: { $ref: "#/components/schemas/Instance" }
                  agents:
                    type: array
                    items: { $ref: "#/components/schemas/Connection" }
                  github: { $ref: "#/components/schemas/Connection" }
        "404": { $ref: "#/components/responses/Error" }
  /api/instances/{id}/connections:
    parameters: [{ $ref: "#/components/parameters/InstanceId" }]
    get:
      tags: [instances]
      summary: Stored state of GitHub and the three agents (no probing, no secrets)
      responses:
        "200":
          description: Connections
          content:
            application/json:
              schema:
                type: object
                properties:
                  instance_id: { type: string }
                  connections:
                    type: array
                    items: { $ref: "#/components/schemas/Connection" }
        "404": { $ref: "#/components/responses/Error" }
  /api/instances/{id}/history:
    parameters: [{ $ref: "#/components/parameters/InstanceId" }]
    get:
      tags: [runs]
      summary: The 20 most recent runs, newest first
      responses:
        "200":
          description: History
          content:
            application/json:
              schema:
                type: object
                properties:
                  runs:
                    type: array
                    maxItems: 20
                    items: { $ref: "#/components/schemas/Run" }
                  limit: { type: integer, const: 20 }
        "404": { $ref: "#/components/responses/Error" }
  /api/instances/{id}/agents:
    parameters: [{ $ref: "#/components/parameters/InstanceId" }]
    get:
      tags: [agents]
      summary: Connection state of each agent (probed in the container when it is running)
      responses:
        "200":
          description: Agent connections
          content:
            application/json:
              schema:
                type: object
                properties:
                  agents:
                    type: array
                    items: { $ref: "#/components/schemas/Connection" }
  /api/instances/{id}/agents/{agent}/models:
    get:
      summary: List available models for an agent in a running instance
      responses:
        '200':
          description: Model catalog
  /api/instances/{id}/agents/{agent}/usage:
    parameters:
      - { $ref: "#/components/parameters/InstanceId" }
      - { $ref: "#/components/parameters/Agent" }
    get:
      tags: [agents]
      summary: Read the account usage limits reported by the agent CLI without sending a prompt
      description: >
        Raw provider payload: Claude Code `get_usage` response, Codex `account/rateLimits/read` result,
        or Antigravity `/usage` JSON. `usage` is null when the agent is not connected or the CLI does not report limits.
        The probe runs under `timeout 20` inside the container.
        Returns `409 instance_not_running` when the instance is stopped.
      responses:
        '200':
          description: Usage payload
          content:
            application/json:
              schema:
                type: object
                properties:
                  usage: { type: [object, "null"] }
  /api/instances/{id}/agents/{agent}/api-key:
    parameters:
      - { $ref: "#/components/parameters/InstanceId" }
      - { $ref: "#/components/parameters/Agent" }
    put:
      tags: [agents]
      summary: Store a provider API key for this instance (encrypted; injected only during runs)
      description: Returns `409 login_in_progress` during an account sign-in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [api_key]
              properties:
                api_key: { type: string, minLength: 8, maxLength: 512, writeOnly: true }
      responses:
        "200":
          description: Stored
          content:
            application/json:
              schema:
                type: object
                properties:
                  connection: { $ref: "#/components/schemas/Connection" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      tags: [agents]
      summary: Remove the stored API key
      description: Returns `409 login_in_progress` during an account sign-in.
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  connection: { $ref: "#/components/schemas/Connection" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/instances/{id}/agents/{agent}/run:
    parameters:
      - { $ref: "#/components/parameters/InstanceId" }
      - { $ref: "#/components/parameters/Agent" }
    post:
      tags: [runs]
      summary: Start a run; follow it with the stream endpoint
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RunRequest" }
      responses:
        "202":
          description: Accepted
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema:
                type: object
                properties:
                  run: { $ref: "#/components/schemas/Run" }
                  stream_url: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /api/instances/{id}/runs/{runId}:
    parameters:
      - { $ref: "#/components/parameters/InstanceId" }
      - { $ref: "#/components/parameters/RunId" }
    get:
      tags: [runs]
      summary: Get a run
      responses:
        "200":
          description: Run
          content:
            application/json:
              schema:
                type: object
                properties:
                  run: { $ref: "#/components/schemas/Run" }
        "404": { $ref: "#/components/responses/Error" }
  /api/instances/{id}/runs/{runId}/stream:
    parameters:
      - { $ref: "#/components/parameters/InstanceId" }
      - { $ref: "#/components/parameters/RunId" }
      - name: Last-Event-ID
        in: header
        schema: { type: integer }
      - name: after
        in: query
        schema: { type: integer }
    get:
      tags: [runs]
      summary: Server-Sent Events stream of a run
      description: |
        Events: `status`, `session`, `delta`, `reasoning`, `tool`, `done`. Each event has an incremental `id`.
        Reconnect with `Last-Event-ID` to resume. `done` carries the final Run and ends the stream.
        A comment line `: ping` is sent every 15 seconds. Finished runs older than two minutes return only `done`.
      responses:
        "200":
          description: Event stream
          content:
            text/event-stream:
              schema: { type: string }
        "404": { $ref: "#/components/responses/Error" }
  /api/instances/{id}/runs/{runId}/cancel:
    parameters:
      - { $ref: "#/components/parameters/InstanceId" }
      - { $ref: "#/components/parameters/RunId" }
    post:
      tags: [runs]
      summary: Cancel an active run (its processes are terminated inside the container)
      responses:
        "202":
          description: Cancellation requested
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/instances/{id}/agents/{agent}/login:
    parameters:
      - { $ref: "#/components/parameters/InstanceId" }
      - { $ref: "#/components/parameters/Agent" }
    post:
      tags: [agents]
      summary: Start the official account sign-in of the CLI (claude, codex, antigravity)
      responses:
        "202":
          description: Login session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    get:
      tags: [agents]
      summary: Current login session
      responses:
        "200":
          description: Login session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      tags: [agents]
      summary: Cancel the login session before the account code is submitted
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "409": { $ref: "#/components/responses/Error" }
  /api/instances/{id}/agents/{agent}/login/input:
    parameters:
      - { $ref: "#/components/parameters/InstanceId" }
      - { $ref: "#/components/parameters/Agent" }
    post:
      tags: [agents]
      summary: Send the one-line code shown after sign-in (Claude Code, Google Antigravity)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code]
              properties:
                code: { type: string, maxLength: 2048 }
      responses:
        "202":
          description: Code sent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/instances/{id}/agents/{agent}/logout:
    parameters:
      - { $ref: "#/components/parameters/InstanceId" }
      - { $ref: "#/components/parameters/Agent" }
    post:
      tags: [agents]
      summary: Sign the CLI account out inside the instance
      description: Returns `409 login_in_progress` during an account sign-in.
      responses:
        "200":
          description: Signed out
          content:
            application/json:
              schema:
                type: object
                properties:
                  connection: { $ref: "#/components/schemas/Connection" }
        "409": { $ref: "#/components/responses/Error" }
  /api/instances/{id}/github/connect:
    parameters: [{ $ref: "#/components/parameters/InstanceId" }]
    post:
      tags: [github]
      summary: Create a single-use state (10 minutes, PKCE) and the GitHub authorization URL
      responses:
        "200":
          description: Redirect the user's browser to authorize_url
          content:
            application/json:
              schema:
                type: object
                properties:
                  authorize_url: { type: string, format: uri }
                  expires_at: { type: string, format: date-time }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/instances/{id}/github/callback:
    parameters: [{ $ref: "#/components/parameters/InstanceId" }]
    post:
      tags: [github]
      summary: Complete the connection with the code and state received by the redirect page
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code, state]
              properties:
                code: { type: string }
                state: { type: string }
      responses:
        "200":
          description: Connected
          content:
            application/json:
              schema:
                type: object
                properties:
                  connection: { $ref: "#/components/schemas/Connection" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/instances/{id}/github:
    parameters: [{ $ref: "#/components/parameters/InstanceId" }]
    get:
      tags: [github]
      summary: GitHub connection state (validates the token with GitHub)
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                type: object
                properties:
                  connection: { $ref: "#/components/schemas/Connection" }
                  enabled: { type: boolean }
        "404": { $ref: "#/components/responses/Error" }
  /api/instances/{id}/github/repos:
    parameters:
      - { $ref: "#/components/parameters/InstanceId" }
      - { name: page, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
    get:
      tags: [github]
      summary: Repositories the connection can access (100 per page)
      responses:
        "200":
          description: Repositories
          content:
            application/json:
              schema:
                type: object
                properties:
                  repos:
                    type: array
                    items: { $ref: "#/components/schemas/GitHubRepo" }
                  page: { type: integer }
                  has_more: { type: boolean }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/instances/{id}/repos:
    parameters: [{ $ref: "#/components/parameters/InstanceId" }]
    get:
      tags: [repos]
      summary: Repositories cloned in the instance
      responses:
        "200":
          description: Repositories
          content:
            application/json:
              schema:
                type: object
                properties:
                  repos:
                    type: array
                    items: { $ref: "#/components/schemas/LocalRepo" }
                  selected_repo: { type: string }
        "409": { $ref: "#/components/responses/Error" }
    post:
      tags: [repos]
      summary: Clone the repository, or fetch and fast-forward it when already cloned
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [full_name]
              properties:
                full_name: { type: string, example: octo/app }
                select: { type: boolean, description: Also set it as the instance default repository }
      responses:
        "200":
          description: Synced
          content:
            application/json:
              schema:
                type: object
                properties:
                  repo: { $ref: "#/components/schemas/LocalRepo" }
                  selected: { type: boolean }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /api/instances/{id}/repos/changes:
    parameters:
      - { $ref: "#/components/parameters/InstanceId" }
    get:
      tags: [repos]
      summary: Read local repository changes in the agent worktree
      description: Uses local Git refs without fetching or starting the instance. A missing worktree is clean.
      parameters:
        - { name: full_name, in: query, required: true, schema: { type: string, example: octo/app } }
        - { name: agent, in: query, required: true, schema: { $ref: "#/components/schemas/AgentName" } }
        - { name: include_diff, in: query, schema: { type: boolean, default: false } }
      responses:
        "200":
          description: Worktree status and optional diff
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                type: object
                required: [has_changes, can_push]
                properties:
                  has_changes: { type: boolean, description: Local worktree changes or commits beyond the common base }
                  can_push: { type: boolean, description: Local commits eligible to advance the last-known remote branch }
                  diff: { type: string, description: Unified patch capped at 256 KiB of Git output }
                  untracked:
                    type: array
                    maxItems: 200
                    items: { type: string }
                  truncated: { type: boolean, description: Some diff or untracked output was omitted }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /api/instances/{id}/repos/{owner}/{name}/push:
    parameters:
      - { $ref: "#/components/parameters/InstanceId" }
      - { name: owner, in: path, required: true, schema: { type: string } }
      - { name: name, in: path, required: true, schema: { type: string } }
    post:
      tags: [repos]
      summary: Push the agent worktree to a branch under arara/
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [agent]
              properties:
                agent: { $ref: "#/components/schemas/AgentName" }
                branch: { type: string, description: "Defaults to arara/<agent>; must start with arara/" }
      responses:
        "200":
          description: Pushed
          content:
            application/json:
              schema:
                type: object
                properties:
                  repo: { type: string }
                  branch: { type: string }
                  pushed: { type: boolean }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    apikey:
      type: apiKey
      in: header
      name: apikey
  parameters:
    InstanceId:
      name: id
      in: path
      required: true
      schema: { type: string, pattern: "^inst_[0-9a-f]{24}$" }
    RunId:
      name: runId
      in: path
      required: true
      schema: { type: string, pattern: "^run_[0-9a-f]{24}$" }
    Agent:
      name: agent
      in: path
      required: true
      schema: { $ref: "#/components/schemas/AgentName" }
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InstanceResponse:
      description: Instance
      content:
        application/json:
          schema:
            type: object
            properties:
              instance: { $ref: "#/components/schemas/Instance" }
  schemas:
    AgentName:
      type: string
      enum: [claude, codex, antigravity]
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable snake_case code; translate it in the client
              example: instance_not_running
            message: { type: string }
    Health:
      type: object
      properties:
        status: { type: string, enum: [ok, degraded] }
        checks:
          type: object
          additionalProperties: { type: string, enum: [ok, error] }
        version: { type: string }
    AgentInfo:
      type: object
      properties:
        name: { $ref: "#/components/schemas/AgentName" }
        title: { type: string }
        methods:
          type: array
          items: { type: string, enum: [account, api_key] }
        login: { type: boolean }
    Instance:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        state: { type: string, enum: [stopped, starting, running, stopping, error] }
        created_at: { type: string, format: date-time }
        last_activity_at: { type: string, format: date-time }
        idle_stop_at: { type: string, format: date-time, description: Present while running and idle }
        selected_repo: { type: string }
        agents:
          type: array
          items: { $ref: "#/components/schemas/AgentName" }
        active_runs: { type: integer }
        running_agents:
          type: array
          items: { $ref: "#/components/schemas/AgentName" }
        last_error: { type: string }
    RunRequest:
      type: object
      additionalProperties: false
      required: [prompt]
      properties:
        prompt: { type: string, minLength: 1, maxLength: 102400 }
        session_id: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9_-]{0,127}$", description: Continue this CLI session }
        model: { type: string, maxLength: 80 }
        repo: { type: string, description: "owner/name already cloned; defaults to the instance selected_repo" }
    Run:
      type: object
      properties:
        id: { type: string }
        instance_id: { type: string }
        agent: { $ref: "#/components/schemas/AgentName" }
        prompt: { type: string }
        response: { type: string }
        status: { type: string, enum: [running, succeeded, failed, cancelled, timed_out, interrupted] }
        session_id: { type: string }
        repo: { type: string }
        model: { type: string }
        error_code:
          type: string
          description: "agent_not_authenticated, agent_error, agent_exit, agent_incomplete, exec_failed, run_timeout, cancelled_by_request, instance_stopped, gateway_restarted, stream_unavailable"
        error_message: { type: string }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        duration_ms: { type: integer }
    StreamEvent:
      description: Payload of each SSE `data:` line by event type
      oneOf:
        - title: status
          type: object
          properties: { run_id: { type: string }, agent: { type: string }, status: { type: string } }
        - title: session
          type: object
          properties: { type: { const: session }, session_id: { type: string } }
        - title: delta
          type: object
          properties: { type: { const: delta }, text: { type: string } }
        - title: reasoning
          type: object
          properties: { type: { const: reasoning }, text: { type: string } }
        - title: tool
          type: object
          properties: { type: { const: tool }, tool: { type: string }, detail: { type: string } }
        - title: done
          $ref: "#/components/schemas/Run"
    Connection:
      type: object
      properties:
        provider: { type: string, enum: [github, claude, codex, antigravity] }
        status: { type: string, enum: [connected, disconnected, expired, error, setup_required] }
        method: { type: string, enum: [account, api_key, oauth] }
        account: { type: string, description: "Login, e-mail or masked key; never a secret" }
        error: { type: string }
        updated_at: { type: string, format: date-time }
    Login:
      type: object
      properties:
        id: { type: string }
        instance_id: { type: string }
        agent: { $ref: "#/components/schemas/AgentName" }
        status: { type: string, enum: [starting, waiting_for_user, succeeded, failed, cancelled] }
        url: { type: string, format: uri, description: Official sign-in page to open in the user's browser }
        code: { type: string, description: Device code to type on the sign-in page (Codex) }
        needs_input: { type: boolean, description: The CLI waits for the code shown after sign-in (Claude Code, Google Antigravity) }
        error: { type: string, enum: [login_timeout, login_failed, not_authenticated] }
        expires_at: { type: string, format: date-time }
    LoginResponse:
      type: object
      properties:
        login: { $ref: "#/components/schemas/Login" }
    LocalRepo:
      type: object
      properties:
        full_name: { type: string }
        default_branch: { type: string }
        path: { type: string }
    GitHubRepo:
      type: object
      properties:
        full_name: { type: string }
        private: { type: boolean }
        default_branch: { type: string }
        can_push: { type: boolean }
        updated_at: { type: string, format: date-time }
