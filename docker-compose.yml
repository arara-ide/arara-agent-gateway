services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${APP_NAME}-${ENVIRONMENT}
    hostname: ${APP_NAME}-${ENVIRONMENT}
    env_file:
      - .env
    environment:
      DATA_DIR: /data
      PORT: "${PORT}"
      DOCKER_SOCKET: /var/run/docker.sock
    ports:
      - "127.0.0.1:${GATEWAY_PORT}:${PORT}"
    volumes:
      - gateway-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${DOCKER_GID}"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  gateway-data:
